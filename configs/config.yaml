# Nightingale configuration.
# Secrets belong in .env, never here (see .env.example).

seed: 42 # used for splits, Synthea generation, and model training

compute:
  # cpu | cuda. Code must read this value and never switch to CUDA on its own.
  # Leave it at cpu on the owner's laptop. GPU tests there run from the separate
  # .venv-gpu, each only after the owner says yes (D-9); heavy jobs run on the cloud
  # or the university GPU, and the owner picks where for each one (docs/11, D-7).
  # Cloud job commands set cuda explicitly.
  device: cpu

paths:
  data_root: data
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external

datasets:
  ddxplus:
    hf_id: aai530-group6/ddxplus
    license: CC-BY-4.0
    role: primary ML training and differential ground truth
  bodhi_s:
    hf_id: ekacare/BODHI-S
    license: CC-BY-NC-4.0 # NON-COMMERCIAL — see docs/03-data-management.md §1.2
    role: cardiac medical knowledge graph seed
  uci_heart:
    hf_id: MLLab-TS/heart_disease_uci
    license: open (verify mirror)
    role: cardiac-risk sub-model and real-data sanity check

graph:
  # neo4j | networkx, for open_graph_store() in src/medical_kg/neo4j_store.py. The app
  # reads these keys when it builds its pipeline (1e); scripts take them as flags.
  # neo4j reads the shared graph from AuraDB (decision D-6) and falls back to networkx
  # over the locally built graph when Aura is paused, offline or refuses the login;
  # results then report degraded_components: ["graph_backend"] (docs/02 §7, R-06).
  # Load or refresh the graph in Aura with scripts/load_neo4j.py.
  # Connection settings live in .env, never here: NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD
  # and, optionally, NEO4J_DATABASE. Without it the store uses the home database,
  # which on AuraDB is named after the instance id, not "neo4j".
  backend: neo4j
  namespace: CardiacKG # the label on every node of the graph in Neo4j
  connection_timeout_seconds: 10

ranking:
  # Fusion weights are tuned on VALIDATION ONLY and must be reported in the
  # write-up — they are a result, not a hidden hyperparameter.
  ml_weight: 0.5
  kg_weight: 0.5
  top_k_display: 5
  top_k_evidence: 3

safety:
  enable_red_flags: true # never disable outside an ablation run
  must_not_miss_recall_target: 0.95

retrieval:
  embedding_model: pritamdeka/S-PubMedBert-MS-MARCO
  chunk_size: 512
  chunk_overlap: 64
  top_k: 10
  rerank_top_k: 5

llm:
  provider: ollama
  model: llama3.1:8b # quantised (~4.9 GB); pulled where it runs (D-5, Phase 3)
  # Ollama puts the model on a GPU automatically. On the owner's laptop it runs only
  # for short tests, each after the owner's yes (docs/11 §3, D-9). Batch runs (the B3/B4
  # baselines) go to the cloud or the university GPU, and the owner picks where.
  temperature: 0.1 # low — this is an explainer, not a writer
  max_tokens: 512
  timeout_seconds: 30 # falls back to TemplateExplainer on timeout

evaluation:
  # The test split is opened ONCE, in Phase 4.
  # docs/05-evaluation-protocol.md §2
  allow_test_split: false
  bootstrap_samples: 1000
  confidence_level: 0.95
  calibration_bins: 10

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: nightingale
