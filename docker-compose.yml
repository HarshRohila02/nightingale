# Neo4j for the cardiac medical knowledge graph.
#
#   docker compose up -d      start
#   docker compose logs -f    watch startup
#   docker compose down       stop (data persists in the named volumes)
#
# Browser: http://localhost:7474   ·   Bolt: bolt://localhost:7687
# Credentials come from .env (copy .env.example). Defaults are fine locally —
# this database holds no patient data, only public medical knowledge.
#
# If Docker becomes a time sink, switch to the NetworkX backend instead of
# fighting it (risk R-06 in docs/07-risk-register.md).

services:
  neo4j:
    image: neo4j:5-community
    container_name: nightingale-neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt driver
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nightingale}
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/external/neo4j-import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
