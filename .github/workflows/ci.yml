name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Neo4j for the live Neo4j-store tests (marker "neo4j" in
    # tests/test_neo4j_store.py). The team's graph lives on AuraDB (D-6), and CI never
    # sees its credentials. This password guards a container that exists only for
    # the length of the job.
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
          NEO4J_server_memory_heap_initial__size: 256M
          NEO4J_server_memory_heap_max__size: 512M
          NEO4J_server_memory_pagecache_size: 128M
        ports:
          - 7687:7687
    env:
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements-dev.txt is the single source of truth for tool versions, so
      # CI and every developer's venv run identical black/ruff/pytest. The full
      # requirements.txt (torch, faiss, mlflow) is slow to install and unnecessary
      # for these tests — add it when CI covers model training.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format check
        run: black --check src tests scripts

      - name: Lint
        run: ruff check src tests scripts

      - name: Tests
        run: pytest --cov=src --cov-report=term-missing

      # Golden cases encode clinical expectations. A failure here means the
      # system's diagnostic behaviour changed — treat it as a blocking bug, not
      # a test to update. See docs/06-engineering-conventions.md §6.
      - name: Golden clinical cases
        run: pytest -m golden -v
